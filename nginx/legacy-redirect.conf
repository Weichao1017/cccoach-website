# 创问官网附加规则（由 cccoach-website 仓库部署，主配置未改；跳转表和存档页映射在 /www/server/panel/vhost/nginx/0.cccoach_legacy_map.conf）
# 1) 能对上新站的：301 到新页面
if ($cccoach_legacy_301) { return 301 https://www.cccoach.cn$cccoach_legacy_301; }
# 1b) http 统一跳 https（证书续期用的 /.well-known/ 除外）
set $cccoach_to_https "";
if ($scheme = http) { set $cccoach_to_https "1"; }
if ($uri ~ "^/\.well-known/") { set $cccoach_to_https ""; }
if ($cccoach_to_https) { return 301 https://www.cccoach.cn$request_uri; }
# 2) 对不上的：有旧原文存档页就显示存档页（文件不存在则继续走原来的 404）
if (-f /www/wwwroot/cccoach-legacy$cccoach_legacy_static) { rewrite ^ $cccoach_legacy_static last; }
location ^~ /__legacy/ {
    internal;
    root /www/wwwroot/cccoach-legacy;
    charset utf-8;
    default_type text/html;
    expires 1h;
    try_files $uri =404;
}
# 3) 旧站图片和视频：只开放图片/视频目录和格式（excel、files 等目录一律 404）
location ^~ /uploads/ {
    root /home/coach;
    # 旧服务器 PageSpeed 生成的压缩版图片网址（如 600x416x原名.png.pagespeed.ic.xxx.jpg）→ 原图
    location ~* "^(?<ps_dir>/uploads/(?:ueditor|activity|list|banner|nav|page|course)/.+/)(?<ps_full>(?:\d+x\d+x|x)?(?<ps_file>[^/]+?\.(?:jpe?g|png|gif|bmp)))\.pagespeed\.[^/]+$" {
        expires 30d;
        try_files $ps_dir$ps_file $ps_dir$ps_full =404;
    }
    location ~* ^/uploads/(?:ueditor|activity|list|banner|nav|page|course)/[^?]+\.(?:jpe?g|png|gif|bmp|mp4)$ {
        expires 30d;
        try_files $uri =404;
    }
    return 404;
}
# 4) 新站重复页、空页、测试页（新站后台内容未动，只在这里处理访问）
location = /article/54 { return 301 https://www.cccoach.cn/article/65; }  # 与 65 同题，65 已改正错字
location = /article/55 { return 301 https://www.cccoach.cn/article/67; }  # 与 67 同题，67 内容更完整
location = /37         { return 301 https://www.cccoach.cn/article/63; }  # 正文为空，同题文章在 63
location = /article/1  { return 410; }                                  # JPress 自带测试文章
# 5) 站点地图修正：地址改成 https；根标签由 sitemapindex 改成 urlset（原来的写法不合规范）
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/xml application/xml;
    sub_filter_once off;
    sub_filter '<sitemapindex' '<urlset';
    sub_filter '</sitemapindex>' '</urlset>';
    sub_filter 'http://www.cccoach.cn' 'https://www.cccoach.cn';
}
# 6) robots.txt（站点地图写完整网址）和 llms.txt（给 AI 助手的站点说明）
location = /robots.txt { root /www/wwwroot/cccoach-seo; default_type text/plain; charset utf-8; }
location = /llms.txt   { root /www/wwwroot/cccoach-seo; default_type text/plain; charset utf-8; }
