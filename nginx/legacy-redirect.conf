# 创问旧站网址处理（跳转表和存档页映射在 /www/server/panel/vhost/nginx/0.cccoach_legacy_map.conf）
# 1) 能对上新站的：301 到新页面
if ($cccoach_legacy_301) { return 301 https://www.cccoach.cn$cccoach_legacy_301; }
# 2) 对不上的：有旧原文存档页就显示存档页（文件不存在则继续走原来的 404）
if (-f /www/wwwroot/cccoach-legacy$cccoach_legacy_static) { rewrite ^ $cccoach_legacy_static last; }
location ^~ /__legacy/ {
    internal;
    root /www/wwwroot/cccoach-legacy;
    charset utf-8;
    default_type text/html;
    expires 1h;
    try_files $uri =404;
}
# 3) 旧站图片和视频：只开放图片/视频目录和格式（excel、files 等目录一律 404）
location ^~ /uploads/ {
    root /home/coach;
    # 旧服务器 PageSpeed 生成的压缩版图片网址（如 600x416x原名.png.pagespeed.ic.xxx.jpg）→ 原图
    location ~* "^(?<ps_dir>/uploads/(?:ueditor|activity|list|banner|nav|page|course)/.+/)(?<ps_full>(?:\d+x\d+x|x)?(?<ps_file>[^/]+?\.(?:jpe?g|png|gif|bmp)))\.pagespeed\.[^/]+$" {
        expires 30d;
        try_files $ps_dir$ps_file $ps_dir$ps_full =404;
    }
    location ~* ^/uploads/(?:ueditor|activity|list|banner|nav|page|course)/[^?]+\.(?:jpe?g|png|gif|bmp|mp4)$ {
        expires 30d;
        try_files $uri =404;
    }
    return 404;
}
