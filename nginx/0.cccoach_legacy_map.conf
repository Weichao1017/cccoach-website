# 创问官网：旧站（2017-2025，ThinkPHP）网址 → 新站 301 跳转，只含已确认一一对应的 29 条
# 2026-09-29 由 Claude 添加。回滚：删除本文件和 extension/www.cccoach.cn/legacy-redirect.conf，然后 nginx -s reload
map $uri $cccoach_legacy_key {
    default "";
    "~*^/(?:home|wap)/page/index/id/(?<cl_id>\d+)(?:\.html)?$"  "page:$cl_id";
    "~*^/(?:home|wap)/list/index/id/(?<cl_id>\d+)(?:/p/\d+)?(?:\.html)?$"  "list:$cl_id";
}
