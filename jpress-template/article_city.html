#define css()

    #if(article.modified?? || article.created??)<meta property="bytedance:updated_time" content="#date(article.modified ?? article.created, "yyyy-MM-dd'T'HH:mm:ss")+08:00" />#end
<link href="highlight/styles/railscasts.css" rel="stylesheet">
<link href="#(CPATH)/static/components/ckeditor5/ck-content.css" rel="stylesheet">
<link type="text/css" rel="stylesheet" href="#(CPATH)#(TPATH)/css/cityCenter.css?_164521511232" />
<style>
    .article-thumbimg {
        background-position: center;
        background-size: cover;
    }
</style>
#end
#define script()
<script src="#(CPATH)/static/components/jquery/jquery.form.min.js"></script>
<script src="highlight/highlight.pack.js"></script>
<script>

    hljs.initHighlightingOnLoad();

</script>

#define content()
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"#(article.title.replace('"', '“'))","datePublished":"#date(article.created, 'yyyy-MM-dd')","dateModified":"#date(article.modified ?? article.created, 'yyyy-MM-dd')","author":{"@type":"EducationalOrganization","name":"创问中国教练中心","url":"https://www.cccoach.cn/"},"publisher":{"@type":"EducationalOrganization","name":"创问中国教练中心","url":"https://www.cccoach.cn/"},"mainEntityOfPage":"https://www.cccoach.cn#(article.url ??)","inLanguage":"zh-CN"}</script>
<div class="fixd-h">
    <div class="ac-block-container bg_007855" style="padding: 2rem 0;">
        <div class="sh-p-sp ac-block-content_text">
            #(unescape(article.summary))
        </div>
    </div>
    <div class="ac-block-container" style="padding: 2rem 0;">
        #(article.content ??)
    </div>
</div>
#end
